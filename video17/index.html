<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors</title>
    <style>
        /*element selector*/
      /*  div{
            background-color: red;
        }*/
        /*class selector*/
        .red{
            background-color: red;
        }
        #green{
            background-color: green;
        }
        div >p{
            color: blue;
            background-color: yellow;

        }
        *{
            margin: 0;
            padding: 0;
        }
      
      a:visited{
        color: yellow;
      }
    </style>
</head>
<body>
    <div class="red">i am  div
        <p>i am a child selector inside div</p>
    </div>
    <div id="green"> i ma another div</div>
    <a href="https://www.google.com">go to google</a>
    
</body>
</html>
