<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card</title>
  <style>
    body {display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f4f4;font-family:sans-serif;}
    .card {width:300px;background:#fff;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1);overflow:hidden;}
    .card img {width:100%;height:180px;object-fit:cover;}
    .tags {padding:8px;}
    .tag {background:#e0f0ff;color:#0077cc;padding:3px 6px;margin-right:5px;border-radius:3px;font-size:12px;}
    h2 {margin:8px;font-size:18px;}
    p {margin:0 8px 12px;color:#555;font-size:13px;}
    button {margin:0 8px 12px;width:calc(100% - 16px);padding:8px;background:#0077cc;color:#fff;border:none;border-radius:5px;cursor:pointer;}
    button:hover {background:#005fa3;}
  </style>
</head>
<body>
  <div class="card">
    <!-- Replace "ganesh.jpg" with your actual file name -->
    <img src="ganesh.jpg" alt="Ganesh">
    <div class="tags"><span class="tag">Nature</span><span class="tag">Lake</span></div>
    <h2>Ganesh</h2>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <button>Read More</button>
  </div>
</body>
</html>
