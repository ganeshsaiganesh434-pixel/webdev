<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
            font-family: sans-serif;
        }
        .card{
            background-color:#f4f4f4;
            width: 350px;
            border-radius: 10px;
            box-shadow: 4px 10px rgba(0,0, 0, 0.1);
overflow: hidden;        }
.card img
{
width: 100%;
height: 200px;
object-fit: cover;
}
.tags{

}
.tag{
    display: inline-block;
    background:  #e0f0ff;
    color: #0077cc;
     font-size: 12px;
      padding: 4px 8px;
      margin-right: 6px;
      border-radius: 10px;
}
h2{
    margin: 8px;
    font-size: 18px;
}
p{
    margin: 0 8px 12px;
    color: #555;
    font-size: 13px;

}
button{
    margin: 0 8px 12px;
    width: calc(100%-16px);
    padding: 8px;
    background: #0077cc;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor:pointer;


}
button:hover{
    background: #005fa3;
}

</head>
